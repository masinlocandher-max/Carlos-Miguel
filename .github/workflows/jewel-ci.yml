name: Jewel OS integrity and tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jewel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify capability seal and run the suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The seal is the point of this repository. If the sealed core changed
      # without an owner re-seal, the build fails here and the change cannot
      # reach main quietly.
      - name: Verify the capability seal
        run: node tools/seal-cli.mjs verify

      # CI holds NO signing key. JEWEL_SEAL_PUBLIC_KEY is a public value and is
      # configured as a repository VARIABLE, not a secret. Pinning it here is
      # what catches an attacker who edits the core, re-signs with their own
      # key and rewrites jewel.pub - that build verifies against itself but
      # fails against the pinned key.
      - name: Verify the owner signature against the pinned public key
        env:
          JEWEL_SEAL_PUBLIC_KEY: ${{ vars.JEWEL_SEAL_PUBLIC_KEY }}
        run: |
          if [ -z "${JEWEL_SEAL_PUBLIC_KEY}" ]; then
            echo "::warning::JEWEL_SEAL_PUBLIC_KEY is not set as a repository variable."
            echo "::warning::The seal is only checked against the in-repo jewel.pub, which an attacker who controls the repo could also replace."
          fi
          node tools/seal-cli.mjs verify

      - name: Run the runtime test suite
        run: npm test

      # The UI tests need no install: they run on Node's type stripping.
      - name: Run the interface test suite
        run: npm run test:ui

      - name: Confirm no secrets are tracked
        run: |
          if git ls-files | grep -E '^\.env$|^\.jewel/' ; then
            echo "::error::Secrets or runtime data are tracked in git."
            exit 1
          fi
          echo "No secrets or runtime data tracked."

      - name: Report the capability surface
        run: node jewel.mjs tools
