name: Jewel interface checks
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'public/jewel/**', 'package*.json', 'tsconfig.json', 'vite.config.ts', 'index.html', '.github/workflows/interface-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
